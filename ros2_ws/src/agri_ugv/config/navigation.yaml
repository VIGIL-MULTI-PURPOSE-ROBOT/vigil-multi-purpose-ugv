controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 45.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 1.5
      lookahead_dist: 1.5
      min_lookahead_dist: 0.8
      max_lookahead_dist: 4.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.4
      min_approach_linear_velocity: 0.25
      approach_velocity_scaling_dist: 1.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.7
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 2.0
      regulated_linear_scaling_min_speed: 0.4
      use_rotate_to_heading: false
      allow_reversing: true
      max_robot_pose_search_dist: 5.0
    use_sim_time: true
    enable_stamped_cmd_vel: false
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.3
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 500000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      minimum_turning_radius: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 6.0
      smooth_path: true
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
    use_sim_time: true
    enable_stamped_cmd_vel: false
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    use_sim_time: true
    enable_stamped_cmd_vel: false
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 10000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    use_sim_time: true
    enable_stamped_cmd_vel: false
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 2.75
    - 0.0
    - 1.375
    min_velocity:
    - -1.25
    - 0.0
    - -1.375
    max_accel:
    - 2.0
    - 0.0
    - 1.75
    max_decel:
    - -2.5
    - 0.0
    - -2.0
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
    use_sim_time: true
    enable_stamped_cmd_vel: false
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 3
      visualize: false
      enabled: true
    observation_sources:
    - lidar
    - camera
    use_sim_time: true
    enable_stamped_cmd_vel: false
    lidar:
      type: pointcloud
      topic: /perception/lidar_obstacles
      min_height: -0.3
      max_height: 2.5
      enabled: false
    camera:
      type: pointcloud
      topic: /perception/hazards
      min_height: -0.3
      max_height: 2.5
      enabled: false
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      footprint: '[[0.95,0.63],[0.95,-0.63],[-0.89,-0.63],[-0.89,0.63]]'
      footprint_padding: 0.04
      resolution: 0.1
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      track_unknown_space: false
      rolling_window: true
      always_send_full_costmap: true
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.4
        cost_scaling_factor: 3.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      width: 12
      height: 12
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar hazards raw_lidar camera_clear
        lidar:
          topic: /perception/lidar_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5
          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
        hazards:
          topic: /perception/hazards
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5
          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
        raw_lidar:
          topic: /lidar/points
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5
          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
        camera_clear:
          topic: /perception/clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5
          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
