          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
        raw_lidar:
          topic: /lidar/points
          data_type: PointCloud2
          marking: false
