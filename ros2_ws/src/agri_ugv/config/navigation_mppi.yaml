controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 45.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56
      model_dt: 0.1
      batch_size: 800
      ax_max: 0.4
      ax_min: -0.5
      ay_max: 0.0
      ay_min: 0.0
      az_max: 0.35
      vx_std: 0.16
      vy_std: 0.0
      wz_std: 0.12
      vx_max: 0.55
      vx_min: -0.25
      vy_max: 0.0
      wz_max: 0.275
      iteration_count: 1
      prune_distance: 3.5
      transform_tolerance: 0.4
      temperature: 0.3
      gamma: 0.015
      motion_model: Ackermann
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 2.0
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 2
    use_sim_time: true
    enable_stamped_cmd_vel: false
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.3
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 500000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      minimum_turning_radius: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 6.0
      smooth_path: true
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
    use_sim_time: true
    enable_stamped_cmd_vel: false
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    use_sim_time: true
    enable_stamped_cmd_vel: false
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 10000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    use_sim_time: true
    enable_stamped_cmd_vel: false
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.55
    - 0.0
    - 0.275
    min_velocity:
    - -0.25
    - 0.0
    - -0.275
    max_accel:
    - 0.4
    - 0.0
    - 0.35
    max_decel:
    - -0.5
    - 0.0
    - -0.4
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
    use_sim_time: true
    enable_stamped_cmd_vel: false
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 3
      visualize: false
      enabled: true
    observation_sources:
    - lidar
    - camera
    use_sim_time: true
    enable_stamped_cmd_vel: false
    lidar:
      type: pointcloud
      topic: /perception/lidar_obstacles
      min_height: -0.3
      max_height: 2.5
      enabled: true
    camera:
      type: pointcloud
      topic: /perception/hazards
      min_height: -0.3
      max_height: 2.5
      enabled: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      footprint: '[[0.95,0.63],[0.95,-0.63],[-0.89,-0.63],[-0.89,0.63]]'
      footprint_padding: 0.04
      resolution: 0.1
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      track_unknown_space: false
      rolling_window: true
      always_send_full_costmap: true
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.4
        cost_scaling_factor: 3.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      width: 12
      height: 12
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: lidar hazards raw_lidar camera_clear
        lidar:
          topic: /perception/lidar_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5
          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
        hazards:
          topic: /perception/hazards
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5
          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
        raw_lidar:
          topic: /lidar/points
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5
          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
        camera_clear:
          topic: /perception/clearing
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.3
          max_obstacle_height: 2.5
          obstacle_min_range: 0.25
          obstacle_max_range: 18.0
          raytrace_min_range: 0.1
          raytrace_max_range: 20.0
          observation_persistence: 0.0
